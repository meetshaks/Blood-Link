# Example only: replace paths and hostname before enabling.
server {
    listen 80;
    server_name bloodlink.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bloodlink.example.com;
    root /var/www/bloodlink/public;
    index index.php;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    ssl_certificate /etc/letsencrypt/live/bloodlink.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloodlink.example.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ /\.(?!well-known) { deny all; }
}
