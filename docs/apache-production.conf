# Use the public/ directory as the VirtualHost DocumentRoot.
# Keep app/, database/, tools/, and docs/ outside the published directory.
<VirtualHost *:443>
    ServerName bloodlink.example.com
    DocumentRoot /var/www/bloodlink/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bloodlink.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bloodlink.example.com/privkey.pem

    <Directory /var/www/bloodlink/public>
        AllowOverride All
        Require all granted
    </Directory>
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self)"
</VirtualHost>

<VirtualHost *:80>
    ServerName bloodlink.example.com
    Redirect permanent / https://bloodlink.example.com/
</VirtualHost>
