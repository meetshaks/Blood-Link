<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#b71c1c">
    <title>ব্লাডলিংক · অফলাইন</title>
    <style>
        :root { color-scheme: light; font-family: Inter, "Hind Siliguri", system-ui, sans-serif; background: #fff9f8; color: #1f2937; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); place-items: center; }
        main { width: min(440px, 100%); padding: 32px 24px; border: 1px solid #e5e7eb; border-radius: 20px; background: #fff; box-shadow: 0 12px 30px rgb(0 0 0 / 8%); text-align: center; }
        .logo { display: block; width: 76px; height: 76px; margin: 0 auto 16px; }
        h1 { margin: 0 0 10px; color: #b71c1c; font-size: 1.65rem; line-height: 1.3; }
        p { margin: 0; line-height: 1.65; }
        .note { margin-top: 12px; color: #6b7280; font-size: .9rem; }
        .status { min-height: 1.6em; margin-top: 14px; color: #1b7f3b; font-weight: 600; }
        .actions { display: grid; gap: 10px; margin-top: 20px; }
        button, .home { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 9px 16px; border: 1px solid #d32f2f; border-radius: 8px; background: #d32f2f; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
        .home { border-color: #b71c1c; background: #fff; color: #b71c1c; }
        .language { display: inline-flex; gap: 8px; margin-top: 20px; }
        .language button { min-height: 36px; padding: 4px 12px; border-color: #e5e7eb; background: #fff; color: #374151; font-size: .9rem; }
        .language button[aria-pressed="true"] { border-color: #b71c1c; color: #b71c1c; }
        button:focus-visible, a:focus-visible { outline: 3px solid rgb(211 47 47 / 45%); outline-offset: 3px; }
        @media (prefers-reduced-motion: no-preference) { main { animation: arrive .25s ease-out both; } @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
    </style>
</head>
<body>
    <main>
        <img class="logo" data-logo alt="">
        <h1 data-copy="title">ইন্টারনেট সংযোগ নেই</h1>
        <p data-copy="message">এই পেজটি অফলাইনে দেখানো হচ্ছে। ডোনার খোঁজা, লগইন, রেজিস্ট্রেশন ও অ্যাকাউন্টের কাজের জন্য ইন্টারনেট লাগবে।</p>
        <p class="note" data-copy="note">সংযোগ ফিরে এলে আবার চেষ্টা করুন।</p>
        <p class="status" role="status" aria-live="polite" data-status></p>
        <div class="actions">
            <button type="button" data-retry>আবার চেষ্টা করুন</button>
            <a class="home" href="./" data-home>হোমে ফিরুন</a>
        </div>
        <div class="language" role="group" aria-label="ভাষা / Language">
            <button type="button" data-language="bn" aria-pressed="true">বাংলা</button>
            <button type="button" data-language="en" aria-pressed="false">English</button>
        </div>
    </main>
    <script>
        (() => {
            const copy = {
                bn: {
                    title: 'ইন্টারনেট সংযোগ নেই',
                    message: 'এই পেজটি অফলাইনে দেখানো হচ্ছে। ডোনার খোঁজা, লগইন, রেজিস্ট্রেশন ও অ্যাকাউন্টের কাজের জন্য ইন্টারনেট লাগবে।',
                    note: 'সংযোগ ফিরে এলে আবার চেষ্টা করুন।',
                    retry: 'আবার চেষ্টা করুন',
                    home: 'হোমে ফিরুন',
                    restored: 'ইন্টারনেট সংযোগ ফিরে এসেছে। আবার চেষ্টা করুন।',
                    checking: 'সংযোগ পরীক্ষা করা হচ্ছে…'
                },
                en: {
                    title: 'You are offline',
                    message: 'This page is available offline. Donor search, login, registration, and account features need an internet connection.',
                    note: 'Try again when your connection returns.',
                    retry: 'Try again',
                    home: 'Return to home',
                    restored: 'You are back online. Try again now.',
                    checking: 'Checking your connection…'
                }
            };
            const status = document.querySelector('[data-status]');
            const retry = document.querySelector('[data-retry]');
            const home = document.querySelector('[data-home]');
            const logo = document.querySelector('[data-logo]');
            const params = new URLSearchParams(window.location.search);
            let language = params.get('lang') === 'en' ? 'en' : 'bn';

            const render = () => {
                const strings = copy[language];
                document.documentElement.lang = language;
                document.title = `BloodLink · ${strings.title}`;
                document.querySelectorAll('[data-copy]').forEach(element => {
                    element.textContent = strings[element.dataset.copy];
                });
                retry.textContent = strings.retry;
                document.querySelector('[data-home]').textContent = strings.home;
                document.querySelectorAll('[data-language]').forEach(button => {
                    button.setAttribute('aria-pressed', String(button.dataset.language === language));
                });
            };

            const controllerScript = navigator.serviceWorker?.controller?.scriptURL;
            if (controllerScript) {
                const appBase = new URL('./', controllerScript);
                home.href = appBase.href;
                logo.src = new URL('assets/icons/icon-192.png?v=4', appBase).href;
            }

            document.querySelectorAll('[data-language]').forEach(button => {
                button.addEventListener('click', () => {
                    language = button.dataset.language;
                    render();
                });
            });
            retry.addEventListener('click', () => {
                status.textContent = copy[language].checking;
                window.location.reload();
            });
            window.addEventListener('online', () => {
                status.textContent = copy[language].restored;
            });
            render();
        })();
    </script>
</body>
</html>
